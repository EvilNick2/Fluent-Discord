name: make-release
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      version: ${{ steps.version_check.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if metadata version is new
        id: version_check
        run: |
          version="$(sed -nE 's/^\$version:[[:space:]]*"([^"]+)";[[:space:]]*$/\1/p' src/modules/core/_metadata.scss | tr -d '\r' | head -n 1)"

          if [ -z "$version" ]; then
            echo "Could not parse version from src/modules/core/_metadata.scss" >&2
            exit 1
          fi

          git fetch --tags --force
          latest_tag="$(git tag --list --sort=-v:refname | head -n 1)"

          normalized_version="${version#v}"
          normalized_latest_tag="${latest_tag#v}"

          if [ -z "$latest_tag" ]; then
            should_release=true
            echo "No existing tags found; releasing version $version."
          elif [ "$normalized_version" = "$normalized_latest_tag" ]; then
            should_release=false
            echo "Latest tag ($latest_tag) already matches metadata version ($version); skipping release."
          else
            should_release=true
            echo "Metadata version ($version) differs from latest tag ($latest_tag); releasing."
          fi

          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Build CSS outputs
      - name: Build theme CSS files
        run: |
          mkdir -p dist release-assets
          npm install --global sass

          while IFS='|' read -r source destination; do
            sass --style=expanded "$source" "$destination"
            sed -i '1d' "$destination"
          done <<'BUILDS'
          src/fluent-build.scss|dist/Fluent-Discord.css
          src/variants/fluent-guts-auto.scss|dist/Fluent-In-Guts.theme.css
          src/variants/fluent-guts-static.scss|dist/Fluent-In-Guts-static.theme.css
          src/variants/fluent-memories-auto.scss|dist/Fluent-In-Memories.theme.css
          src/variants/fluent-memories-static.scss|dist/Fluent-In-Memories-static.theme.css
          BUILDS

          cp dist/Fluent-In-Guts.theme.css release-assets/
          cp dist/Fluent-In-Guts-static.theme.css release-assets/
          cp dist/Fluent-In-Memories.theme.css release-assets/
          cp dist/Fluent-In-Memories-static.theme.css release-assets/

          find dist -mindepth 1 -maxdepth 1 -type f ! -name 'Fluent-Discord.css' -delete

      # Deploy to gh-pages
      - name: GitHub Pages action
        uses: peaceiris/actions-gh-pages@v3.7.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: false
          commit_message: Deployment from Action

      - name: Upload theme CSS files to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.version }}
          name: ${{ needs.detect-version.outputs.version }}
          files: |
            release-assets/Fluent-In-Guts.theme.css
            release-assets/Fluent-In-Guts-static.theme.css
            release-assets/Fluent-In-Memories.theme.css
            release-assets/Fluent-In-Memories-static.theme.css
          fail_on_unmatched_files: true
          generate_release_notes: true
